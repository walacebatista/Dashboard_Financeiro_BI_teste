<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard de Vendas BI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fa;--card:#fff;--bd:#d8dee6;--tx:#1b2430;--mu:#66717f;--a:#0969da;--b:#8250df;--g:#1a7f37;--r:#cf222e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e14;--card:#131a24;--bd:#243040;--tx:#e6edf3;--mu:#8b98a8;--a:#58a6ff;--b:#a371f7;--g:#3fb950;--r:#f85149;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0e14;--card:#131a24;--bd:#243040;--tx:#e6edf3;--mu:#8b98a8;--a:#58a6ff;--b:#a371f7;--g:#3fb950;--r:#f85149;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding:20px;max-width:1150px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px}
h1{font-size:24px;margin:0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:13px;margin-top:4px}
.f{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:4px;text-transform:uppercase;letter-spacing:.05em}
select,button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer}
button:hover,select:hover{border-color:var(--a)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--a),var(--b))}
.kpi span{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:28px;margin:6px 0 2px}
.d{font-size:12px;font-weight:600}.up{color:var(--g)}.dn{color:var(--r)}
.row{display:grid;gap:12px;margin-bottom:12px}
.r1{grid-template-columns:2fr 1fr}.r2{grid-template-columns:1fr 1fr}
@media(max-width:760px){.r1,.r2{grid-template-columns:1fr}}
h2{font-size:13px;margin:0 0 12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.box{position:relative;height:290px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:1px solid var(--bd);cursor:pointer;white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--a),var(--b));margin-top:4px}
.hint{font-size:11px;color:var(--mu);margin-top:8px}
</style>
</head>
<body>
<header>
<div><h1>📊 Dashboard de Vendas BI</h1><div class="sub">Dados fictícios de 2026 · clique nas barras de região para filtrar</div></div>
<div class="f">
<label>Região<select id="reg"></select></label>
<label>Canal<select id="can"></select></label>
<button id="rst">Limpar</button>
</div>
</header>
<div class="kpis" id="kpis"></div>
<div class="row r1">
<div class="card"><h2>Receita x Lucro por mês</h2><div class="box"><canvas id="c1"></canvas></div></div>
<div class="card"><h2>Canais de venda</h2><div class="box"><canvas id="c2"></canvas></div></div>
</div>
<div class="row r2">
<div class="card"><h2>Receita por região</h2><div class="box"><canvas id="c3"></canvas></div><div class="hint">Clique em uma barra para filtrar.</div></div>
<div class="card"><h2>Produtos</h2><div class="wrap"><table><thead><tr><th data-k="n">Produto</th><th data-k="rev">Receita</th><th data-k="mg">Margem</th><th data-k="ped">Pedidos</th></tr></thead><tbody id="tb"></tbody></table></div><div class="hint">Clique no cabeçalho para ordenar.</div></div>
</div>
<script>
const M=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const R=["Sudeste","Sul","Nordeste","Centro-Oeste"],C=["E-commerce","Loja física","Marketplace"];
const P=["Notebook Pro","Monitor 4K","Teclado Mecânico","Headset","Webcam HD"];
const pr=[4200,1900,380,320,210],mgp=[.22,.28,.41,.37,.33];
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const rows=[];
M.forEach((m,mi)=>R.forEach((r,ri)=>C.forEach((c,ci)=>P.forEach((p,pi)=>{
  const o=Math.round((6+rnd()*14)*(1+mi*.05)*[1.6,1,.8,.55][ri]*[1.3,.9,1][ci]*(pi>1?2.2:1));
  const rev=o*pr[pi]*(.95+rnd()*.1);
  rows.push({mi,r:ri,c:ci,p:pi,o,rev,lu:rev*(mgp[pi]+(rnd()-.5)*.04)});
}))));
const $=i=>document.getElementById(i);
$("reg").innerHTML='<option value="-1">Todas</option>'+R.map((x,i)=>`<option value="${i}">${x}</option>`).join("");
$("can").innerHTML='<option value="-1">Todos</option>'+C.map((x,i)=>`<option value="${i}">${x}</option>`).join("");
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const cmp=v=>v>=1e6?"R$ "+(v/1e6).toFixed(2).replace(".",",")+" mi":brl(v);
const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
Chart.defaults.font.family="-apple-system,Segoe UI,sans-serif";
Chart.defaults.color=col("--mu");
const cols=()=>[col("--a"),col("--b"),col("--g")];
const c1=new Chart($("c1"),{data:{labels:M,datasets:[
 {type:"bar",label:"Receita",data:[],backgroundColor:col("--a"),borderRadius:4,order:2},
 {type:"line",label:"Lucro",data:[],borderColor:col("--g"),backgroundColor:col("--g"),tension:.35,order:1}]},
 options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{tooltip:{callbacks:{label:t=>t.dataset.label+": "+brl(t.raw)}}},scales:{y:{ticks:{callback:v=>cmp(v)}}}}});
const c2=new Chart($("c2"),{type:"doughnut",data:{labels:C,datasets:[{data:[],backgroundColor:cols(),borderWidth:0}]},options:{maintainAspectRatio:false,cutout:"65%",plugins:{legend:{position:"bottom"},tooltip:{callbacks:{label:t=>t.label+": "+brl(t.raw)}}}}});
const c3=new Chart($("c3"),{type:"bar",data:{labels:R,datasets:[{data:[],backgroundColor:[],borderRadius:6}]},options:{indexAxis:"y",maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:t=>brl(t.raw)}}},scales:{x:{ticks:{callback:v=>cmp(v)}}},
 onClick:(e,el)=>{if(el.length){const i=el[0].index;$("reg").value=$("reg").value==i?-1:i;draw()}}}});
let sort={k:"rev",d:-1};
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;sort={k,d:sort.k==k?-sort.d:-1};draw()});
const sum=(a,f)=>a.reduce((x,r)=>x+f(r),0);
function draw(){
 const rg=+$("reg").value,cn=+$("can").value;
 const d=rows.filter(r=>(rg<0||r.r==rg)&&(cn<0||r.c==cn));
 const half=(a,b)=>d.filter(r=>r.mi>=a&&r.mi<b);
 const k=(f)=>{const n=sum(half(9,12),f),o=sum(half(6,9),f);return{t:sum(d,f),dl:(n-o)/o*100}};
 const rev=k(r=>r.rev),lu=k(r=>r.lu),pe=k(r=>r.o);
 const tk=rev.t/pe.t,tkN=sum(half(9,12),r=>r.rev)/sum(half(9,12),r=>r.o),tkO=sum(half(6,9),r=>r.rev)/sum(half(6,9),r=>r.o);
 const dlt=v=>`<div class="d ${v>=0?"up":"dn"}">${v>=0?"▲":"▼"} ${Math.abs(v).toFixed(1)}% vs trimestre anterior</div>`;
 $("kpis").innerHTML=[["Receita",cmp(rev.t),rev.dl],["Lucro",cmp(lu.t),lu.dl],["Pedidos",pe.t.toLocaleString("pt-BR"),pe.dl],["Ticket médio",brl(tk),(tkN-tkO)/tkO*100]]
  .map(([a,b,c])=>`<div class="card kpi"><span>${a}</span><b>${b}</b>${dlt(c)}</div>`).join("");
 c1.data.datasets[0].data=M.map((_,i)=>sum(d.filter(r=>r.mi==i),r=>r.rev));
 c1.data.datasets[1].data=M.map((_,i)=>sum(d.filter(r=>r.mi==i),r=>r.lu));
 c2.data.datasets[0].data=C.map((_,i)=>sum(d.filter(r=>r.c==i),r=>r.rev));
 c3.data.datasets[0].data=R.map((_,i)=>sum(d.filter(r=>r.r==i),r=>r.rev));
 c3.data.datasets[0].backgroundColor=R.map((_,i)=>rg<0||rg==i?col("--b"):col("--bd"));
 [c1,c2,c3].forEach(c=>c.update());
 const pt=P.map((n,i)=>{const x=d.filter(r=>r.p==i),rv=sum(x,r=>r.rev);return{n,rev:rv,mg:sum(x,r=>r.lu)/rv*100,ped:sum(x,r=>r.o)}})
  .sort((a,b)=>sort.k=="n"?sort.d*a.n.localeCompare(b.n):sort.d*(a[sort.k]-b[sort.k]));
 const mx=Math.max(...pt.map(p=>p.rev));
 $("tb").innerHTML=pt.map(p=>`<tr><td>${p.n}</td><td>${cmp(p.rev)}<div class="bar" style="width:${p.rev/mx*100}%"></div></td><td>${p.mg.toFixed(1)}%</td><td>${p.ped.toLocaleString("pt-BR")}</td></tr>`).join("");
}
$("reg").onchange=$("can").onchange=draw;
$("rst").onclick=()=>{$("reg").value=-1;$("can").value=-1;draw()};
draw();
</script>
</body>
</html>
